name: Coverage

on:
  push:
    branches: [dev]
  pull_request:
    branches:
      - "*"

jobs:
  coverage:
    runs-on: ubuntu-latest
    container:
      image: node:lts
      env:
        CI: true
    steps:
      - uses: actions/checkout@v7
      - name: Prepare
        run: |
          apt-get update
          apt-get install -y cmake flac lcov
      - name: Install
        run: npm i
      - name: Build & Test
        run: ./scripts/coverage.sh rebuild
      - name: Coveralls
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ./coverage/combined.info
