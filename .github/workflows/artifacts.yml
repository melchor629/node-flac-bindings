name: Build Artifacts

on:
  push:
    tags: ['v*']

jobs:
  linux-build:
    strategy:
      matrix:
        pack:
          - tag: trixie
            arch: amd64
            os: latest
          - tag: trixie
            arch: arm64
            os: 24.04-arm
          - tag: alpine
            arch: amd64
            os: latest
          - tag: alpine
            arch: arm64
            os: 24.04-arm
    runs-on: ubuntu-${{ matrix.pack.os }}
    permissions:
      contents: read
    container:
      image: node:24-${{ matrix.pack.tag }}
      env:
        CI: true
    steps:
      # see https://github.com/actions/runner/issues/801#issuecomment-3747934364
      - uses: laverdet/alpine-arm64@v1
        name: alpine tricks
        if: matrix.pack.tag == 'alpine' && matrix.pack.arch == 'arm64'
      - uses: actions/checkout@v7
      - name: Prepare
        run: |
          if [[ "${{ matrix.pack.tag }}" = "alpine" ]]; then
            apk add --no-cache cmake build-base git
          else
            apt-get update
            apt-get install -y cmake
          fi
        shell: sh
      - name: Install
        run: npm ci
      - name: Build
        run: npm run prebuild -w packages/flac-bindings-lib
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pack-${{ matrix.pack.tag }}-${{ matrix.pack.arch }}
          path: packages/flac-bindings-lib/prebuilds

  macos-build:
    strategy:
      matrix:
        pack:
          - version: latest
            arch: arm64
          - version: '15-intel'
            arch: amd64
    runs-on: macos-${{ matrix.pack.version }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install
        run: npm ci
      - name: Build
        run: npm run prebuild -w packages/flac-bindings-lib
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pack-macos-${{ matrix.pack.arch }}
          path: packages/flac-bindings-lib/prebuilds

  windows-build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install
        run: npm ci
      - name: Build (x64)
        run: npm run prebuild -w packages/flac-bindings-lib
      - name: Build (x86)
        run: |
          $Env:NODE_ARCH = "x86"
          npm run prebuild -w packages/flac-bindings-lib
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pack-windows
          path: packages/flac-bindings-lib/prebuilds

  publish-libraries:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs:
      - linux-build
      - macos-build
      - windows-build
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Unzip native libraries
        run: |
          mkdir -p packages
          for f in *.tar.zstd; do
            zstd -d -c "$f" | tar -xf - -C packages
          done
          rm -r *.tar.zstd
          ls -lh packages/*
      - name: Publish native libraries
        run: |
          TAG="$(echo '${{ github.ref_name }}' | awk '{ split($0,a,"-"); if (a[2] == "") { print "latest" } else { split(a[2],b,"."); print b[1] } }')"
          for d in packages/*; do
            cd "$d"
            npm publish --access public --provenance --tag "$TAG"
            cd ../..
          done

  publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs:
      - publish-libraries
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish main package
        run: |
          TAG="$(echo '${{ github.ref_name }}' | awk '{ split($0,a,"-"); if (a[2] == "") { print "latest" } else { split(a[2],b,"."); print b[1] } }')"
          npm publish --access public --provenance --tag "$TAG"
