name: Node CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build:
    strategy:
      matrix:
        node:
          - version: 22
            napi: 10
          - version: 24
            napi: 10
          - version: 26
            napi: 10
    runs-on: ubuntu-latest
    container:
      image: node:${{ matrix.node.version }}-trixie
      env:
        CI: true
    steps:
      - uses: actions/checkout@v7
      - name: Prepare
        run: |
          apt-get update
          apt-get install -y cmake flac
      - name: Install
        run: npm i
      - name: Build
        run: |
          cd packages/flac-bindings-lib
          npx cmake-js configure --CDnapi_build_version=${{ matrix.node.napi }}
          npx cmake-js build -j4
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
