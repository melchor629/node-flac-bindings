plugins:
  - vitest
extends:
  - plugin:vitest/legacy-recommended
  - plugin:vitest/legacy-all
rules:
  import/no-extraneous-dependencies:
    - error
    - devDependencies: true
  vitest/max-expects: [0]
  vitest/no-hooks: [0]
  vitest/require-to-throw-message: [0]
  vitest/prefer-expect-assertions: [0]
